name: Docker Build and Deploy

on:
  push:
    branches:
      - 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Paso 1: Checkout del código
      - name: Checkout code
        uses: actions/checkout@v4

      # Paso 2: Construir y publicar la imagen Docker
      - name: Login to Docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{secrets.DOCKERHUB_USERNAME}}/basic-back:latest
      - name: Verify_image
        run: docker run --rm ${{ secrets.DOCKERHUB_USERNAME }}/basic-back:latest node --version

      # Paso 3: Conectarse al servidor y actualizar el contenedor
      - name: Deploy to Production
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Configurar SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.PORT }} -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

          # Conectar al servidor y ejecutar comandos
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.PORT }} ${{ secrets.USER }}@${{ secrets.HOST }} << EOF
          set -e

          # Paso Eliminar imagen `backup` anterior (si existe)
            docker image rm -f ${{ secrets.DOCKERHUB_USERNAME }}/basic-back:backup || true

          # Crear etiqueta de backup para la imagen actual
            if docker images | grep "${{ secrets.DOCKERHUB_USERNAME }}/basic-back"; then
              echo "Creando etiqueta de respaldo para la imagen actual..."
              docker tag ${{ secrets.DOCKERHUB_USERNAME }}/basic-back:latest ${{ secrets.DOCKERHUB_USERNAME }}/basic-back:backup
            else
              echo "No se encontró una imagen 'latest'."
            fi

          # Actualizar la imagen y el contenedor
            echo "Actualizando la imagen y desplegando la nueva versión..."
            cd /var/www/basic-back/back
            docker compose pull
            docker compose up -d

            # Limpiar imágenes no etiquetadas, exepto la: backup
            echo "Limpiando imágenes antiguas no etiquetadas..."            
            docker image prune --force --filter "label!=backup"      
          EOF